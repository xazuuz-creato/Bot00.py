<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio AI Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}.style-card.active{border-color:#6366f1;background-color:rgba(99,102,241,.15)}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
<header class="border-b border-slate-800 bg-slate-900/90 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
  <div><h1 class="text-lg font-black">ULTRA STUDIO <span class="text-indigo-400">30 MATRIX</span></h1>
  <p class="text-[11px] text-slate-400">30 نمطاً × 3 خصائص — إنتاج MP4 حقيقي</p></div>
  <div class="text-xs font-mono bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
    <span id="wsDot" class="inline-block w-2 h-2 rounded-full bg-rose-400"></span> <span id="wsStatus">غير متصل</span></div>
</header>
<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div class="lg:col-span-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-5">
    <div><h2 class="text-base font-bold mb-1">فكرة الفيديو والنص</h2>
      <textarea id="topicInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500" placeholder="اكتب فكرة الفيديو بالتفصيل..."></textarea></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-slate-300 block mb-2">الخاصية الفرعية:</label>
        <div class="grid grid-cols-3 gap-2" id="props"></div></div>
      <div><label class="text-xs text-slate-300 block mb-2">المدة التقريبية:</label>
        <select id="duration" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
          <option value="15">15 ثانية</option><option value="30" selected>30 ثانية</option><option value="60">دقيقة</option><option value="120">دقيقتان</option><option value="180">3 دقائق</option><option value="300">5 دقائق</option></select></div>
    </div>
    <div><label class="text-xs text-slate-300 block mb-2">نمط التصميم (30):</label>
      <div id="stylesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-56 overflow-y-auto p-1 border border-slate-800 rounded-xl bg-slate-950"></div></div>
    <div class="pt-4 border-t border-slate-800 space-y-4">
      <button id="submitBtn" onclick="startProduction()" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 to-pink-600 font-bold text-xs disabled:opacity-50">ابدأ إنتاج الفيديو 🚀</button>
      <div id="progressBox" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
        <div class="flex justify-between text-xs font-mono"><span id="progressStage" class="text-indigo-400"></span><span id="progressPercent">0%</span></div>
        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden"><div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-pink-500 h-full w-0 transition-all duration-300"></div></div></div>
      <div id="videoResultBox" class="hidden bg-slate-950 border border-emerald-800/60 rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between text-xs text-emerald-400 font-bold"><span>✅ اكتمل الإنتاج</span>
          <span class="flex gap-2"><a id="srtBtn" href="#" target="_blank" class="bg-slate-700 px-3 py-1 rounded-lg">SRT</a>
          <a id="videoDownloadBtn" href="#" download class="bg-emerald-600 px-3 py-1 rounded-lg">تنزيل 📥</a></span></div>
        <video id="outputVideoPlayer" controls class="w-full rounded-lg aspect-video bg-black"></video></div>
    </div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col h-[640px]">
    <h2 class="text-sm font-bold border-b border-slate-800 pb-3 mb-4">سجل المخرج (حي)</h2>
    <div id="chatMessages" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 overflow-y-auto space-y-2 text-xs font-mono"></div>
  </div>
</main>
<script>
const DESIGN_STYLES = [
 "الموشن جرافيك الحديث (Minimal Motion)","فلوج وتيك توك (Viral TikTok/Reels)","الشرح التقني والمستقبلي (Cyberpunk/Tech)",
 "الرسوم الكرتونية (2D/3D Cartoon)","السرد التراثي والتاريخي (Vintage/Historical)","الغموض والرعب النفسي (Dark Horror)",
 "ريلز إنستغرام الجمالي (Aesthetic Minimalist)","النيون المضيء المتوهج (Glow Neon)","الخطوط العربية الحرة (Arabic Calligraphy Art)",
 "قصص الكوميكس والمانجا (Comic/Manga)","العروض الهندسية المعمارية (Architectural Blueprint)","تصميم الطباشير والسبورة (Whiteboard Chalk)",
 "أسلوب الجرائد الورقية (Vintage Newspaper)","النمط الرياضي الحماسي (Sports/Gym Kinetic)","الخيال العلمي والفضاء (Sci-Fi Deep Space)",
 "عالم الألعاب والـ Pixel Art (8-Bit Gaming)","نمط المجلات الفاخرة (Luxury/Fashion Editorial)","السفر والمغامرات (Travel Vlog / Polaroid)",
 "المظهر الورقي المقطع (Paper Collage/Stop-Motion)","الإعلانات السينمائية واللوحات الضخمة (Epic Cinematic Trailer)","الأسلوب الزيتي الفني (Oil Painting/Artistic)",
 "الرسوم المائية الهادئة (Watercolor Splatter)","نمط شركات المليار (Corporate Tech Clean)","المونتاج السيكيدلي السريالي (Psychedelic/Surreal)",
 "المحاكاة الواقعية وعناصر VFX (Photorealistic VFX)","الرسوم الطبية والبيولوجية (Medical/Sci-Explainer)","نمط الطبخ وصناعة الأطعمة (Cinematic Food/ASMR)",
 "اللمسة الطينية Claymation (Clay/Plasticine)","أسلوب Vector الكرتوني المسطح (Flat Vector Animation)","النمط الكولونيالي العتيق (Retro 80s/90s VHS)"
];
const PROPS = [["وثائقي","📄 وثائقي 24"],["سينمائي","🎬 سينمائي 30"],["ديناميكي","⚡ ديناميكي 60"]];
let selectedStyle = DESIGN_STYLES[0], selectedProp = 'سينمائي', ws;
const $ = id => document.getElementById(id);

function initStylesGrid(){
  const g=$('stylesGrid');
  DESIGN_STYLES.forEach((s,i)=>{const c=document.createElement('div');
    c.className='style-card p-2 rounded-lg border text-[11px] cursor-pointer border-slate-800 text-slate-400 bg-slate-900/40'+(i===0?' active':'');
    c.innerText=`${i+1}. ${s}`;
    c.onclick=()=>{document.querySelectorAll('.style-card').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedStyle=s;};
    g.appendChild(c);});
}
function renderProps(){
  $('props').innerHTML='';
  PROPS.forEach(([k,label])=>{const b=document.createElement('button');
    b.className='py-2 rounded-xl border text-[11px] '+(k===selectedProp?'border-indigo-600 bg-indigo-600/20 font-bold':'border-slate-800 bg-slate-950 text-slate-300');
    b.innerText=label;b.onclick=()=>{selectedProp=k;renderProps();};$('props').appendChild(b);});
}
function log(t,cls='text-emerald-400'){const d=document.createElement('div');d.className='bg-slate-900 border border-slate-800 p-2 rounded-lg '+cls;d.innerText='> '+t;$('chatMessages').appendChild(d);$('chatMessages').scrollTop=1e9;}

function initWebSocket(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/studio-director`);
  ws.onopen=()=>{$('wsStatus').innerText='متصل';$('wsDot').className='inline-block w-2 h-2 rounded-full bg-emerald-400';};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    $('progressBox').classList.remove('hidden');
    $('progressBar').style.width=d.progress+'%';$('progressPercent').innerText=d.progress+'%';$('progressStage').innerText=d.message;
    log(d.message, d.status==='error'?'text-rose-400':'text-emerald-400');
    if(d.status==='error'){$('submitBtn').disabled=false;}
    if(d.status==='completed'){
      (d.warnings||[]).forEach(w=>log('⚠️ '+w,'text-amber-400'));
      log(`المشاهد: ${d.scenes} | المدة: ${d.duration}ث | ${d.fps}fps | صور AI: ${d.ai_images} | مشاهد بصوت: ${d.voiced_scenes}`,'text-sky-300');
      $('submitBtn').disabled=false;$('videoResultBox').classList.remove('hidden');
      const url=d.cloud_url||d.video_url;
      $('outputVideoPlayer').src=d.video_url;$('videoDownloadBtn').href=url;$('srtBtn').href=d.srt_url;$('outputVideoPlayer').load();
    }
  };
  ws.onclose=()=>{$('wsStatus').innerText='غير متصل';$('wsDot').className='inline-block w-2 h-2 rounded-full bg-rose-400';$('submitBtn').disabled=false;setTimeout(initWebSocket,3000);};
}
function startProduction(){
  const topic=$('topicInput').value.trim();
  if(!topic){alert('اكتب فكرة الفيديو أولاً');return;}
  if(!ws||ws.readyState!==WebSocket.OPEN){alert('السيرفر غير متصل بعد، انتظر لحظة.');return;}
  $('submitBtn').disabled=true;$('videoResultBox').classList.add('hidden');
  ws.send(JSON.stringify({video_idea:topic,design_style:selectedStyle,property_setting:selectedProp,duration:+$('duration').value}));
}
window.onload=()=>{initStylesGrid();renderProps();initWebSocket();
  fetch('/api/health').then(r=>r.json()).then(h=>{
    log(`حالة المحرك: Claude=${h.script_llm_claude?'✔':'✘'} | صور Replicate=${h.ai_images_replicate?'✔':'✘'} | صوت=${h.voice_edge_tts?'✔':'✘'} | ffmpeg=${h.ffmpeg?'✔':'✘'}`,'text-indigo-300');}).catch(()=>{});};
</script>
</body></html>
